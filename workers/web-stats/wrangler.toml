name = "hci-web-stats"
main = "src/index.js"
compatibility_date = "2026-11-01"

# No public address. The Worker only runs on its schedule.
workers_dev = false
preview_urls = false

# 06:00 UTC on the 1st of each month (1 am Toronto in winter, 2 am in summer).
[triggers]
crons = ["0 6 1 * *"]

[[d1_databases]]
binding = "DB"
database_name = "hci-web-stats"
database_id = "a1349473-c054-4be4-814f-f9275a44f433"
